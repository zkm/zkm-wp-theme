services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:7-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
    ports:
      - "${WORDPRESS_PORT:-8081}:80"
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/themes/zkm-wp-theme
      - ./plugins:/var/www/html/wp-content/plugins
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  # WP-CLI against the same database and files: docker compose run --rm wpcli post list
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    # Run as the Apache image's www-data (uid 33) so files it writes stay editable by WordPress.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/themes/zkm-wp-theme
      - ./plugins:/var/www/html/wp-content/plugins

volumes:
  db_data:
  wp_data:
